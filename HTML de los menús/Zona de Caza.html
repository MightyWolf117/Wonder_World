<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Fenrir - Teatro de Operaciones v3.1</title>
    <style>
        :root {
            --bg-principal: #050b14;
            --bg-tarjeta: #0d1612;
            --borde: #2c1e15;
            --plata-lunar: #cbd5e1;
            --azul-ego: #00d9ff;
            --verde-triage: #00ff66;
            --rojo-frenesi: #ff3333;
            --amarillo-mood: #ffcc00;
            --oro-ejecucion: #ffd700;
            --fuente-hud: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--plata-lunar);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contenedor { max-width: 1200px; width: 100%; }

        .hud-superior {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 850px) { .hud-superior { grid-template-columns: 1fr; } }

        .bloque-perfil {
            background: #090f19;
            border: 2px solid var(--borde);
            border-radius: 4px;
            padding: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            position: relative;
        }
        
        .avatar-wrapper {
            position: relative;
            width: 80px; height: 80px;
            border: 2px solid var(--azul-ego);
            border-radius: 4px;
            overflow: hidden;
            background: #111a2e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-hint { position: absolute; font-size: 0.5rem; font-family: var(--fuente-hud); bottom: 2px; color: var(--azul-ego); background: rgba(0,0,0,0.7); padding: 1px 4px; border-radius: 2px; }
        #file-avatar { display: none; }

        .perfil-info { flex: 1; font-family: var(--fuente-hud); }
        .perfil-nombre { font-size: 1.2rem; font-weight: bold; color: #fff; letter-spacing: 1px; }
        .perfil-titulo-input {
            background: transparent;
            border: none;
            border-bottom: 1px dashed #4a5568;
            color: var(--azul-ego);
            font-family: var(--fuente-hud);
            font-size: 0.8rem;
            width: 90%;
            padding: 2px 0;
            outline: none;
        }
        .bloque-consejo { font-size: 0.75rem; color: #8a9a86; margin-top: 8px; font-style: italic; border-left: 2px solid var(--borde); padding-left: 6px; }

        .bloque-arsenal {
            background: #091211;
            border: 2px solid var(--borde);
            border-radius: 4px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .arsenal-titulo { font-family: var(--fuente-hud); font-size: 0.75rem; color: #506959; text-transform: uppercase; margin-bottom: 5px; }
        .ammo-pool { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .bullet-token { background: #182622; border: 1px solid var(--borde); padding: 4px 10px; font-family: var(--fuente-hud); font-weight: bold; border-radius: 2px; font-size: 0.85rem; color: #fff; }
        .bullet-token.s-ammo { background: #132430; border-color: rgba(0,217,255,0.3); color: var(--azul-ego); }

        .btn { background: #070d14; border: 1px solid var(--borde); color: var(--plata-lunar); padding: 6px 10px; font-family: var(--fuente-hud); font-size: 0.75rem; font-weight: bold; cursor: pointer; border-radius: 2px; transition: all 0.1s; }
        .btn:hover { border-color: var(--plata-lunar); background: #141f2b; }
        .btn-filter.active { border-color: var(--azul-ego); color: var(--azul-ego); background: #0c1826; }

        .barra-control-tactico {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #080e17;
            border: 1px solid var(--borde);
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .grid-jefes { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-bottom: 25px; }
        
        .card-jefe {
            background: #04080e;
            border: 2px solid var(--borde);
            border-radius: 4px;
            padding: 15px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }
        
        .jefe-terminado { border-color: var(--verde-triage) !important; background: #081a11 !important; }
        .jefe-domado { border-color: var(--oro-ejecucion) !important; background: #1c190a !important; }
        .jefe-enrage { border-color: var(--rojo-frenesi) !important; background: #260c0c !important; box-shadow: 0 0 10px rgba(255,51,51,0.2); }
        .jefe-finalizado { border-color: #4a5568 !important; background: #12161f !important; opacity: 0.7; }

        .jefe-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px dashed var(--borde); padding-bottom: 6px; }
        .jefe-nombre { font-family: var(--fuente-hud); font-weight: bold; font-size: 1rem; color: #fff; }
        .jefe-badge { font-family: var(--fuente-hud); font-size: 0.6rem; padding: 2px 6px; border-radius: 2px; font-weight: bold; text-transform: uppercase; }
        .badge-domable { background: #182b3c; color: var(--azul-ego); }
        .badge-indomable { background: #2b1c3c; color: #cc00ff; }

        .jefe-desc { font-size: 0.75rem; color: #718096; line-height: 1.3; }
        .jefe-meta-box { font-family: var(--fuente-hud); font-size: 0.7rem; color: #a0aec0; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 2px; }

        .barra-vida-contenedor { display: flex; flex-direction: column; gap: 4px; margin: 4px 0; }
        .barra-label { font-family: var(--fuente-hud); font-size: 0.65rem; color: #a0aec0; display: flex; justify-content: space-between; }
        .barra-bg { background: #1a1a1a; height: 10px; border-radius: 2px; overflow: hidden; position: relative; border: 1px solid #2d2d2d; }
        .barra-fill { height: 100%; width: 0%; transition: width 0.3s ease; }
        .fill-ruptura { background: var(--azul-ego); box-shadow: 0 0 5px var(--azul-ego); }
        .fill-ejecucion { background: var(--oro-ejecucion); box-shadow: 0 0 5px var(--oro-ejecucion); }

        .ataque-actions { display: flex; gap: 4px; margin-top: auto; }

        .form-crear { background: #0b131f; border: 1px solid var(--borde); padding: 20px; border-radius: 4px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .form-crear input, .form-crear select { background: #04080e; border: 1px solid var(--borde); color: #fff; padding: 8px; font-family: var(--fuente-hud); font-size: 0.8rem; border-radius: 2px; }

        .panel-editar-jefe { background: #08111a; border: 1px dashed var(--azul-ego); padding: 10px; margin-top: 8px; border-radius: 2px; display: flex; flex-direction: column; gap: 6px; font-family: var(--fuente-hud); font-size: 0.75rem; }
        .panel-editar-jefe input { background: #03060a; border: 1px solid var(--borde); color: #fff; padding: 4px; font-family: var(--fuente-hud); font-size: 0.75rem; border-radius: 2px; }

        /* LISTA DE PENDIENTES RÁPIDOS */
        .linea-pendiente { display: flex; justify-content: space-between; align-items: center; background: #04080e; border: 1px solid var(--borde); padding: 6px 10px; border-radius: 2px; margin-bottom: 4px; font-family: var(--fuente-hud); font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="contenedor">
        <div class="hud-superior">
            <div class="bloque-perfil">
                <div class="avatar-wrapper" onclick="document.getElementById('file-avatar').click()">
                    <img id="img-avatar" class="avatar-img" src="" style="display:none;">
                    <div id="avatar-fallback" style="font-size:1.5rem;">🐺</div>
                    <span class="avatar-hint">SUBIR</span>
                </div>
                <input type="file" id="file-avatar" accept="image/*" onchange="convertirYGuardarAvatar(this)">
                
                <div class="perfil-info">
                    <div class="perfil-nombre">Skyce Wolfstride</div>
                    <input type="text" id="input-titulo-rango" class="perfil-titulo-input" value="Lobo Alfa | Cadete de Medicina" onchange="guardarIdentidadDura()">
                    <div class="bloque-consejo" id="display-consejo-batallon">Cargando transmisiones de la manada...</div>
                </div>
            </div>

            <div class="bloque-arsenal">
                <div>
                    <div class="arsenal-titulo">Cargador de Frecuencias de Caza Dispuestas</div>
                    <div class="ammo-pool" id="display-ammo-pool"></div>
                </div>
                <div style="display:flex; gap:4px; flex-wrap:wrap;">
                    <button class="btn" onclick="cargarMunicionManual('C')" style="color:var(--verde-triage);">+ Cargar C</button>
                    <button class="btn" onclick="cargarMunicionManual('S')" style="color:var(--azul-ego);">+ Cargar S</button>
                    <button class="btn" onclick="deshacerAccionMilitar()" style="color:var(--amarillo-mood); margin-left:auto;">↶ Deshacer</button>
                    <button class="btn" onclick="pasarTurnoDiario()" style="color:#fff; border-color:var(--azul-ego); background:rgba(0,217,255,0.05);">⏳ Pasar el Día</button>
                </div>
            </div>
        </div>

        <div class="barra-control-tactico">
            <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
                <span style="font-family:var(--fuente-hud); font-size:0.75rem; color:#627569; font-weight:bold;">FILTRAR:</span>
                <button class="btn btn-filter active" id="flt-todos" onclick="setFiltroActual('todos')">TODOS</button>
                <button class="btn btn-filter" id="flt-domable" onclick="setFiltroActual('domable')">DOMABLES</button>
                <button class="btn btn-filter" id="flt-indomable" onclick="setFiltroActual('indomable')">INDOMABLES</button>
                <button class="btn btn-filter" id="flt-critico" onclick="setFiltroActual('critico')" style="color:var(--rojo-frenesi);">⚠️ CRÍTICOS</button>
            </div>
            <div style="display:flex; gap:6px;">
                <button class="btn" onclick="exportarDataJSON()" style="color:var(--azul-ego); border-color:var(--azul-ego);">📥 Exportar Data</button>
                <button class="btn" onclick="document.getElementById('input-json-import').click()">📤 Importar Data</button>
                <input type="file" id="input-json-import" accept=".json" style="display:none;" onchange="importarDataJSON(this)">
            </div>
        </div>

        <!-- LISTA DESPLEGABLE DE PENDIENTES RÁPIDOS (SIN C/S) -->
        <details id="det-pendientes" style="margin-bottom:15px; background:#090f16; border:1px solid var(--borde); border-radius:4px;" ontoggle="guardarEstadoDesplegable('pendientes', event)">
            <summary style="padding:10px 15px; font-family:var(--fuente-hud); font-size:0.85rem; font-weight:bold; cursor:pointer; color:var(--azul-ego);">📋 LISTA DE PENDIENTES RÁPIDOS (<span id="txt-count-pendientes">0</span>)</summary>
            <div style="padding:12px; background:#04080e; border-top:1px solid var(--borde);">
                <div style="display:flex; gap:6px; margin-bottom:10px;">
                    <input type="text" id="new-pendiente-txt" placeholder="Añadir nota o recado corto..." style="background:#09121c; border:1px solid var(--borde); color:#fff; padding:6px; font-family:var(--fuente-hud); font-size:0.8rem; flex:1; border-radius:2px;">
                    <button class="btn" onclick="crearPendienteRapido()" style="color:var(--verde-triage); border-color:var(--verde-triage);">+ Añadir</button>
                </div>
                <div id="contenedor-pendientes-lista"></div>
            </div>
        </details>

        <!-- GENERADOR DE JEFES ACOPLADO POR DEFECTO -->
        <details id="det-generador" style="margin-bottom:20px; background:#090f16; border:1px solid var(--borde); border-radius:4px;" ontoggle="guardarEstadoDesplegable('generador', event)">
            <summary style="padding:12px; font-family:var(--fuente-hud); font-size:0.85rem; font-weight:bold; cursor:pointer; color:#fff;">🛠️ RECLUTAR NUEVO OBJETIVO / INFESTACIÓN</summary>
            <div class="form-crear">
                <input type="text" id="f-nombre" placeholder="Firma del Objetivo (Ej: Examen Anatomía)">
                <input type="text" id="f-desc" placeholder="Descripción táctica corta">
                <select id="f-tipo" onchange="toggleInputsFase(this.value)">
                    <option value="domable">Amenaza Domable (Tarea/Proyecto)</option>
                    <option value="indomable">Amenaza Indomable (Estudio Crítico)</option>
                </select>
                <input type="number" id="f-limite" placeholder="Tiempo Límite (Días)" min="1">
                <input type="number" id="f-hp1" placeholder="HP Ruptura (Terminar)" min="1">
                <input type="number" id="f-hp2" placeholder="HP Ejecución (Dominar)">
                <input type="text" id="f-restriccion" placeholder="Restricción (Ej: Bloqueo de Steam)">
                <div style="display:flex; gap:4px;">
                    <select id="f-stat" style="flex:1;">
                        <option value="energia">Castigo: EN</option>
                        <option value="estres">Castigo: ESTRES</option>
                        <option value="mood">Castigo: MOOD</option>
                        <option value="ego">Castigo: EGO</option>
                    </select>
                    <input type="number" id="f-castigoval" placeholder="Valor" style="width:60px;" min="1" value="1">
                </div>
                <button class="btn" onclick="forzarForjaDeJefe()" style="grid-column: 1 / -1; color:var(--azul-ego); border-color:var(--azul-ego); padding:10px;">FORJAR HOSTIL EN TEATRO DE OPERACIONES</button>
            </div>
        </details>

        <h2 style="font-size:1.1rem; border-left:3px solid var(--azul-ego); padding-left:8px; font-family:var(--fuente-hud); margin-bottom:15px;">TEATRO DE OPERACIONES ACTIVAS</h2>
        <div class="grid-jefes" id="contenedor-teatro-jefes"></div>
    </div>

    <script>
        const CONSEJOS_BATALLON = [
            "Pascal, el lobo guardián: \"Sigue adelante, Caballero de la Luna\"",
            "Cercal, el lobo sombrío: \"No hay tiempo para lamerse las heridas\"",
            "Tanni, la hada guía: \"¡No te detengas, alfa!\"",
            "Beatrice, la bruja dorada: \"Cree en tu propia magia, y no mires atrás\"",
            "Jack: \"Confiamos en ti, Wolfi\"",
            "Hung: \"Mantén tu fuerza y la frente en alto, alfa\"",
            "Lycaon: \"El lobo y la elegancia van de la mano, Wolfstride\"",
            "Capitán Jarvis: \"Sigue dejando huellas en la nieve, Caballero de la luna\"",
            "Señorita Gemini: \"Tu mente es la estrategia más afilada de la manada, Skyce. Ejecuta con precisión.\"",
            "Wolfstride, el alfa: \"Construyamos al hombre lobo que queremos ser. Hora de cazar\""
        ];

        let state = {
            titulo: "Lobo Alfa | Cadete de Medicina",
            avatarB64: "",
            consejoActual: CONSEJOS_BATALLON[9],
            ammo: [],
            jefes: [],
            pendientesRapidos: [],
            estadosDesplegados: { pendientes: false, generador: false }
        };
        
        let filtroActual = 'todos';
        let idEditando = null;
        let idEditandoPendiente = null;
        let historialMilitar = [];

        function iniciarTeatro() {
            const cacheDura = localStorage.getItem('fenrir_warroom_state');
            if (cacheDura) {
                state = JSON.parse(cacheDura);
                if (!state.pendientesRapidos) state.pendientesRapidos = [];
                if (!state.estadosDesplegados) state.estadosDesplegados = { pendientes: false, generador: false };
            } else {
                state.jefes = [
                    { id: "j_test1", nombre: "Examen de Anatomía", desc: "Asegurar reconocimiento óseo completo.", tipo: "indomable", limite: 5, hpRupturaMax: 8, hpRupturaCur: 8, restriccion: "Sin lectura de ocio por las mañanas", castigoStat: "estres", castigoVal: 1, estado: "caza", extraCazas: 0 },
                    { id: "j_test2", nombre: "Entregable Morfo I", desc: "Subir archivo PDF detallado de miología.", tipo: "domable", limite: 3, hpRupturaMax: 4, hpRupturaCur: 4, hpEjecucionMax: 3, hpEjecucionCur: 3, restriccion: "Bloqueo de Steam hasta ruptura", castigoStat: "energia", castigoVal: 1, estado: "caza" }
                ];
                state.pendientesRapidos = [
                    { id: "p_1", txt: "Enviar correo a secretaría académica" }
                ];
            }
            renderizarTodo();
        }

        function registrarHitoHistorial() {
            if (historialMilitar.length >= 30) historialMilitar.shift();
            historialMilitar.push(JSON.stringify(state));
        }

        function guardarEnDisco() {
            localStorage.setItem('fenrir_warroom_state', JSON.stringify(state));
        }

        function deshacerAccionMilitar() {
            if (historialMilitar.length > 0) {
                state = JSON.parse(historialMilitar.pop());
                guardarEnDisco();
                renderizarTodo();
            }
        }

        function setFiltroActual(f) {
            filtroActual = f;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            document.getElementById(`flt-${f}`).classList.add('active');
            renderizarTodo();
        }

        function guardarEstadoDesplegable(clave, e) {
            state.estadosDesplegados[clave] = e.target.open;
            guardarEnDisco();
        }

        function exportarDataJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `Fenrir_WarRoom_Backup_${Date.now()}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importarDataJSON(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        let parsed = JSON.parse(e.target.result);
                        if (parsed.jefes) {
                            registrarHitoHistorial();
                            state = parsed;
                            guardarEnDisco();
                            renderizarTodo();
                            alert("¡Data militar restaurada con éxito!");
                        }
                    } catch(err) { alert("Archivo JSON corrupto o no válido."); }
                };
                reader.readAsText(input.files[0]);
            }
        }

        function guardarIdentidadDura() {
            state.titulo = document.getElementById('input-titulo-rango').value;
            guardarEnDisco();
        }

        function convertirYGuardarAvatar(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    registrarHitoHistorial();
                    state.avatarB64 = e.target.result;
                    guardarEnDisco();
                    renderizarTodo();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function cargarMunicionManual(letra) {
            registrarHitoHistorial();
            state.ammo.push(letra);
            guardarEnDisco();
            renderizarTodo();
        }

        /* GESTIÓN DE PENDIENTES RÁPIDOS */
        function crearPendienteRapido() {
            let input = document.getElementById('new-pendiente-txt');
            let txt = input.value.trim();
            if (!txt) return;

            registrarHitoHistorial();
            state.pendientesRapidos.push({ id: "p_" + Date.now(), txt });
            input.value = '';
            guardarEnDisco();
            renderizarTodo();
        }

        function eliminarPendienteRapido(id) {
            registrarHitoHistorial();
            state.pendientesRapidos = state.pendientesRapidos.filter(p => p.id !== id);
            guardarEnDisco();
            renderizarTodo();
        }

        function toggleEditarPendiente(id) {
            idEditandoPendiente = idEditandoPendiente === id ? null : id;
            renderizarTodo();
        }

        function guardarEdicionPendiente(id) {
            let p = state.pendientesRapidos.find(item => item.id === id);
            if (p) {
                registrarHitoHistorial();
                p.txt = document.getElementById(`ed-p-txt-${id}`).value.trim() || p.txt;
                idEditandoPendiente = null;
                guardarEnDisco();
                renderizarTodo();
            }
        }

        function toggleInputsFase(val) {
            const hp2Input = document.getElementById('f-hp2');
            if(val === 'indomable') { hp2Input.style.display = 'none'; hp2Input.value = ''; } 
            else { hp2Input.style.display = 'block'; }
        }

        function forzarForjaDeJefe() {
            let nombre = document.getElementById('f-nombre').value.trim();
            let desc = document.getElementById('f-desc').value.trim();
            let tipo = document.getElementById('f-tipo').value;
            let limite = parseInt(document.getElementById('f-limite').value) || 1;
            let hpRupturaMax = parseInt(document.getElementById('f-hp1').value) || 1;
            let hpEjecucionMax = parseInt(document.getElementById('f-hp2').value) || 0;
            let restriccion = document.getElementById('f-restriccion').value.trim() || "Ninguna";
            let castigoStat = document.getElementById('f-stat').value;
            let castigoVal = parseInt(document.getElementById('f-castigoval').value) || 1;

            if(!nombre) { alert("Asigna una firma al objetivo hostil."); return; }
            registrarHitoHistorial();

            state.jefes.push({
                id: "j_" + Date.now(), nombre, desc: desc || "Operación de campo.", tipo, limite,
                hpRupturaMax, hpRupturaCur: hpRupturaMax,
                hpEjecucionMax: tipo === 'domable' ? hpEjecucionMax : 0,
                hpEjecucionCur: tipo === 'domable' ? hpEjecucionMax : 0,
                restriccion, castigoStat, castigoVal, estado: "caza", extraCazas: 0
            });

            document.getElementById('f-nombre').value = ''; document.getElementById('f-desc').value = '';
            document.getElementById('f-limite').value = ''; document.getElementById('f-hp1').value = '';
            document.getElementById('f-hp2').value = ''; document.getElementById('f-restriccion').value = '';
            
            guardarEnDisco(); renderizarTodo();
        }

        function dispararProyectilAJefe(id, letraArma) {
            let idxAmmo = state.ammo.indexOf(letraArma);
            if(idxAmmo === -1) return;

            let j = state.jefes.find(item => item.id === id);
            if (!j || j.estado === 'escapo' || j.estado === 'se_acabo' || j.estado === 'domado') return;

            if (j.tipo === 'indomable' && letraArma === 'S') return;

            registrarHitoHistorial();
            state.ammo.splice(idxAmmo, 1);

            if (j.hpRupturaCur > 0) {
                j.hpRupturaCur--;
                if(j.hpRupturaCur === 0) {
                    j.estado = j.tipo === 'indomable' ? 'endless' : 'terminado';
                }
            } else if (j.tipo === 'domable' && j.hpEjecucionCur > 0) {
                j.hpEjecucionCur--;
                if(j.hpEjecucionCur === 0) {
                    j.estado = 'domado';
                    alert(`🎯 ¡JEFE DOMADO!: ${j.nombre} colapsó. Registra +1 Moneda en tu panel superior.`);
                }
            } else if (j.tipo === 'indomable' && j.estado === 'endless') {
                j.extraCazas++;
            }

            guardarEnDisco(); renderizarTodo();
        }

        function toggleEdicionJefe(id) {
            idEditando = idEditando === id ? null : id;
            renderizarTodo();
        }

        function aplicarEdicionJefe(id) {
            let j = state.jefes.find(item => item.id === id);
            if(j) {
                registrarHitoHistorial();
                j.limite = parseInt(document.getElementById(`ed-lim-${id}`).value) || j.limite;
                j.hpRupturaCur = parseInt(document.getElementById(`ed-hp1-${id}`).value) || j.hpRupturaCur;
                if(j.tipo === 'domable') {
                    j.hpEjecucionCur = parseInt(document.getElementById(`ed-hp2-${id}`).value) || j.hpEjecucionCur;
                }
                j.restriccion = document.getElementById(`ed-res-${id}`).value.trim() || j.restriccion;
                idEditando = null;
                guardarEnDisco();
                renderizarTodo();
            }
        }

        function cancelarYEliminarJefe(id) {
            if (confirm("¿Cancelar y eliminar este proyecto de la lista? No se aplicarán castigos ni recompensas.")) {
                registrarHitoHistorial();
                state.jefes = state.jefes.filter(item => item.id !== id);
                idEditando = null;
                guardarEnDisco();
                renderizarTodo();
            }
        }

        function purgarTarjetaResuelta(id) {
            registrarHitoHistorial();
            state.jefes = state.jefes.filter(item => item.id !== id);
            guardarEnDisco(); renderizarTodo();
        }

        function pasarTurnoDiario() {
            registrarHitoHistorial();
            state.ammo = [];
            let indexQuote = Math.floor(Math.random() * CONSEJOS_BATALLON.length);
            state.consejoActual = CONSEJOS_BATALLON[indexQuote];

            state.jefes.forEach(j => {
                if (j.estado === 'caza' || j.estado === 'terminado' || j.estado === 'endless' || j.estado === 'enrage') {
                    j.limite--;
                    if (j.limite <= 0) {
                        if (j.tipo === 'indomable') {
                            j.estado = 'se_acabo';
                        } else {
                            if (j.hpRupturaCur > 0) j.estado = 'enrage';
                            else j.estado = 'escapo';
                        }
                    }
                }
            });

            guardarEnDisco(); renderizarTodo();
        }

        function renderizarTodo() {
            document.getElementById('input-titulo-rango').value = state.titulo;
            document.getElementById('display-consejo-batallon').innerText = state.consejoActual;

            // RESTAURAR ACOPLAMIENTO DE DESPLEGABLES SIN AUTODESPLEGAR
            document.getElementById('det-pendientes').open = state.estadosDesplegados.pendientes ? true : false;
            document.getElementById('det-generador').open = state.estadosDesplegados.generador ? true : false;

            const img = document.getElementById('img-avatar');
            const fallback = document.getElementById('avatar-fallback');
            if (state.avatarB64) { img.src = state.avatarB64; img.style.display = 'block'; fallback.style.display = 'none'; } 
            else { img.style.display = 'none'; fallback.style.display = 'block'; }

            const pAmmo = document.getElementById('display-ammo-pool');
            pAmmo.innerHTML = '';
            if (state.ammo.length === 0) { pAmmo.innerHTML = '<span style="font-size:0.75rem; color:#4a5568;">[ Cargador Vacío. Genera C o S desde tu Menú Táctico ]</span>'; } 
            else {
                state.ammo.forEach(a => {
                    let s = document.createElement('span');
                    s.className = `bullet-token ${a === 'S' ? 's-ammo' : ''}`;
                    s.innerText = a; pAmmo.appendChild(s);
                });
            }

            // RENDERIZAR PENDIENTES RÁPIDOS
            document.getElementById('txt-count-pendientes').innerText = state.pendientesRapidos.length;
            const rootPend = document.getElementById('contenedor-pendientes-lista'); rootPend.innerHTML = '';
            
            if (state.pendientesRapidos.length === 0) {
                rootPend.innerHTML = '<div style="font-family:var(--fuente-hud); font-size:0.75rem; color:#4a5568;">Sin recados pendientes en la lista.</div>';
            } else {
                state.pendientesRapidos.forEach(p => {
                    let div = document.createElement('div');
                    div.className = 'linea-pendiente';

                    let htmlEditPend = '';
                    if (idEditandoPendiente === p.id) {
                        htmlEditPend = `
                            <div style="display:flex; gap:4px; margin-top:4px; width:100%;">
                                <input type="text" id="ed-p-txt-${p.id}" value="${p.txt}" style="background:#09121c; border:1px solid var(--borde); color:#fff; padding:4px; font-family:var(--fuente-hud); font-size:0.75rem; flex:1;">
                                <button class="btn" style="color:var(--verde-triage);" onclick="guardarEdicionPendiente('${p.id}')">✓ Guardar</button>
                            </div>
                        `;
                    }

                    div.innerHTML = `
                        <div style="width:100%;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="color:#fff;">• ${p.txt}</span>
                                <div style="display:flex; gap:4px;">
                                    <button class="btn" style="padding:1px 5px; font-size:0.65rem;" onclick="toggleEditarPendiente('${p.id}')">✏️</button>
                                    <button class="btn" style="padding:1px 5px; font-size:0.65rem; color:var(--verde-triage); border-color:var(--verde-triage);" onclick="eliminarPendienteRapido('${p.id}')">✓ Cumplido</button>
                                </div>
                            </div>
                            ${htmlEditPend}
                        </div>
                    `;
                    rootPend.appendChild(div);
                });
            }

            // PRIORIZACIÓN MILITAR AUTOMÁTICA
            let jefesProcesados = [...state.jefes];
            jefesProcesados.sort((a, b) => {
                const mapEstado = { "enrage": 1, "caza": 2, "endless": 3, "terminado": 4, "domado": 5, "escapo": 6, "se_acabo": 7 };
                if (mapEstado[a.estado] !== mapEstado[b.estado]) return mapEstado[a.estado] - mapEstado[b.estado];
                return a.limite - b.limite;
            });

            if (filtroActual === 'domable') jefesProcesados = jefesProcesados.filter(j => j.tipo === 'domable');
            else if (filtroActual === 'indomable') jefesProcesados = jefesProcesados.filter(j => j.tipo === 'indomable');
            else if (filtroActual === 'critico') jefesProcesados = jefesProcesados.filter(j => j.estado === 'enrage' || j.limite <= 2);

            const grid = document.getElementById('contenedor-teatro-jefes');
            grid.innerHTML = '';

            jefesProcesados.forEach(j => {
                let card = document.createElement('div');
                card.className = 'card-jefe';

                let pctRuptura = ((j.hpRupturaMax - j.hpRupturaCur) / j.hpRupturaMax) * 100;
                let pctEjecucion = j.hpEjecucionMax > 0 ? ((j.hpEjecucionMax - j.hpEjecucionCur) / j.hpEjecucionMax) * 100 : 0;

                let htmlBarras = '';
                let htmlBotones = '';
                let statusLabel = `T-Minus: ${j.limite} Días`;

                if (j.estado === 'terminado') card.classList.add('jefe-terminado');
                if (j.estado === 'domado') card.classList.add('jefe-domado');
                if (j.estado === 'enrage') card.classList.add('jefe-enrage');
                if (j.estado === 'escapo' || j.estado === 'se_acabo') card.classList.add('jefe-finalizado');

                if (j.estado === 'escapo') {
                    statusLabel = "❌ ¡SE ESCAPÓ!";
                    htmlBarras = `<div style="font-family:var(--fuente-hud); font-size:0.8rem; color:var(--amarillo-mood); font-weight:bold; margin:10px 0;">Misión Expirada: El objetivo huyó del perímetro. Sin castigo ni recompensa.</div>`;
                    htmlBotones = `<button class="btn" style="width:100%; border-color:#4a5568;" onclick="purgarTarjetaResuelta('${j.id}')">Archivar Reporte</button>`;
                } else if (j.estado === 'se_acabo') {
                    statusLabel = "🏳️ ¡SE ACABÓ!";
                    htmlBarras = `<div style="font-family:var(--fuente-hud); font-size:0.8rem; color:var(--azul-ego); font-weight:bold; margin:10px 0;">Día del Examen Alcanzado. Concluido con [+${j.extraCazas}] Cazas Extra de excelencia.</div>`;
                    htmlBotones = `<button class="btn" style="width:100%; border-color:#4a5568;" onclick="purgarTarjetaResuelta('${j.id}')">Archivar Reporte</button>`;
                } else if (j.estado === 'domado') {
                    statusLabel = "👑 ¡JEFE DOMADO!";
                    htmlBarras = `<div style="font-family:var(--fuente-hud); font-size:0.8rem; color:var(--verde-triage); font-weight:bold; margin:10px 0;">Derrota Absoluta. Recompensa liberada: +1 Moneda adjudicada.</div>`;
                    htmlBotones = `<button class="btn" style="width:100%; border-color:var(--oro-ejecucion);" onclick="purgarTarjetaResuelta('${j.id}')">Reclamar Botín & Archivar</button>`;
                } else {
                    if (j.estado === 'enrage') statusLabel = `⚠️ ¡ENRAGE!: Expirado. Aplicando -${j.castigoVal} Δ ${j.castigoStat.toUpperCase()}/Día`;

                    htmlBarras = `
                        <div class="barra-vida-contenedor">
                            <div class="barra-label"><span>Fase Ruptura (Mínimo)</span><span>${j.hpRupturaCur}/${j.hpRupturaMax} HP</span></div>
                            <div class="barra-bg"><div class="barra-fill fill-ruptura" style="width:${pctRuptura}%"></div></div>
                        </div>
                    `;

                    if (j.tipo === 'domable') {
                        htmlBarras += `
                            <div class="barra-vida-contenedor">
                                <div class="barra-label"><span>Fase Ejecución (Excelencia Moneda)</span><span>${j.hpEjecucionCur}/${j.hpEjecucionMax} HP</span></div>
                                <div class="barra-bg"><div class="barra-fill fill-ejecucion" style="width:${pctEjecucion}%"></div></div>
                            </div>
                        `;
                    } else if (j.tipo === 'indomable' && j.estado === 'endless') {
                        htmlBarras += `
                            <div style="font-family:var(--fuente-hud); font-size:0.75rem; color:var(--azul-ego); background:rgba(0,217,255,0.05); padding:6px; border:1px solid rgba(0,217,255,0.2); text-align:center; border-radius:2px; margin-top:5px;">
                                🛡️ MODO ENDLESS ACTIVO: +${j.extraCazas} Cazas de Perfeccionamiento
                            </div>
                        `;
                    }

                    let hasC = state.ammo.includes('C');
                    let hasS = state.ammo.includes('S');
                    let btnCAttr = hasC ? '' : 'disabled style="opacity:0.3; cursor:not-allowed;"';
                    let btnSAttr = (hasS && j.tipo === 'domable') ? '' : 'disabled style="opacity:0.3; cursor:not-allowed;"';
                    let labelBtnS = j.tipo === 'indomable' ? '[S INCOMPATIBLE]' : '⚡ Atacar (S)';

                    htmlBotones = `
                        <div class="ataque-actions">
                            <button class="btn" ${btnCAttr} onclick="dispararProyectilAJefe('${j.id}', 'C')" style="flex:1; border-color:var(--verde-triage);">⚔️ Atacar (C)</button>
                            <button class="btn" ${btnSAttr} onclick="dispararProyectilAJefe('${j.id}', 'S')" style="flex:1; border-color:var(--azul-ego);">${labelBtnS}</button>
                        </div>
                    `;
                }

                let textRestriccion = j.hpRupturaCur > 0 ? j.restriccion : "<span style='color:var(--verde-triage); font-weight:bold;'>[RESTRICCIÓN LEVANTADA]</span>";

                let htmlPanelEdicion = '';
                if (idEditando === j.id) {
                    htmlPanelEdicion = `
                        <div class="panel-editar-jefe">
                            <div style="display:flex; gap:4px;">
                                <label style="flex:1;">Días Limite: <input type="number" id="ed-lim-${j.id}" value="${j.limite}"></label>
                                <label style="flex:1;">HP Ruptura: <input type="number" id="ed-hp1-${j.id}" value="${j.hpRupturaCur}"></label>
                            </div>
                            ${j.tipo === 'domable' ? `<label>HP Ejecución: <input type="number" id="ed-hp2-${j.id}" value="${j.hpEjecucionCur}"></label>` : ''}
                            <label>Restricción: <input type="text" id="ed-res-${j.id}" value="${j.restriccion}"></label>
                            <div style="display:flex; gap:4px; margin-top:4px;">
                                <button class="btn" onclick="aplicarEdicionJefe('${j.id}')" style="flex:1; color:var(--verde-triage); border-color:var(--verde-triage);">✓ Guardar</button>
                                <button class="btn" onclick="cancelarYEliminarJefe('${j.id}')" style="color:var(--rojo-frenesi); border-color:var(--rojo-frenesi);">🗑️ Cancelar Proyecto</button>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="jefe-header">
                        <div>
                            <div class="jefe-nombre">${j.nombre}</div>
                            <div style="font-family:var(--fuente-hud); font-size:0.65rem; color:var(--amarillo-mood); margin-top:2px;">${statusLabel}</div>
                        </div>
                        <div style="display:flex; gap:4px; align-items:center;">
                            <button class="btn" style="padding:2px 5px; font-size:0.6rem;" onclick="toggleEdicionJefe('${j.id}')">✏️</button>
                            <span class="jefe-badge badge-${j.tipo}">${j.tipo}</span>
                        </div>
                    </div>
                    <div class="jefe-desc">${j.desc}</div>
                    <div class="jefe-meta-box">
                        <strong>Restricción activa:</strong> ${textRestriccion}<br>
                        <span style="color:#5c6c7d;">Fallo crónico: -${j.castigoVal} a Δ ${j.castigoStat.toUpperCase()}</span>
                    </div>
                    ${htmlPanelEdicion}
                    ${htmlBarras}
                    ${htmlBotones}
                `;
                grid.appendChild(card);
            });
        }

        window.addEventListener('keydown', function(e) { if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); deshacerAccionMilitar(); } });

        iniciarTeatro();
    </script>
</body>
</html>
